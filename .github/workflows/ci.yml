name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: nilam
          POSTGRES_USER: nilam
          POSTGRES_PASSWORD: nilam
        options: >-
          --health-cmd "pg_isready -U nilam -d nilam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://nilam:nilam@localhost:5432/nilam
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-development-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/check-js-budget.mjs
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: docker compose config --quiet
      - run: pnpm audit --prod --audit-level=high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'
          skip-dirs: node_modules,apps/web/.next,services/dataops/.venv,.turbo

  dataops:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dataops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: nilam
          POSTGRES_USER: nilam
          POSTGRES_PASSWORD: nilam
        options: >-
          --health-cmd "pg_isready -U nilam -d nilam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://nilam:nilam@localhost:5432/nilam
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-development-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      AUTH_SECRET: ci-e2e-auth-secret-must-be-32-chars
      E2E_AUTH_SECRET: ci-e2e-session-secret
      PAYMENT_GATEWAY_MODE: fake
      FAKE_PAYMENT_SECRET: nilam-safe-fake-payment-secret
      TELEGRAM_BOT_USERNAME: NilamLocalBot
      RAZORPAY_ALLOW_LIVE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run browser and worker integration tests
        run: |
          export DOCUMENT_STORAGE_DIR="$GITHUB_WORKSPACE/.data/documents"
          pnpm --filter @nilam/worker dev > /tmp/nilam-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid"' EXIT
          pnpm test:e2e
